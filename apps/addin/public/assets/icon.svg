<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheet Agent">
  <title>Sheet Agent</title>
  <defs>
    <linearGradient id="sa-card" x1="10" y1="6" x2="44" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset=".55" stop-color="#16a862"/>
      <stop offset="1" stop-color="#0d8a4f"/>
    </linearGradient>
    <linearGradient id="sa-grid" x1="34" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fc776"/>
      <stop offset="1" stop-color="#0e7a48"/>
    </linearGradient>
    <linearGradient id="sa-x" x1="16" y1="22" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8f5e4"/>
    </linearGradient>
    <linearGradient id="sa-spark" x1="40" y1="38" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
  </defs>

  <!-- grid panel, behind -->
  <rect x="31" y="10" width="26" height="44" rx="5" fill="url(#sa-grid)"/>
  <g fill="#0b6b40" opacity=".55">
    <rect x="36" y="17" width="7" height="6" rx="1"/>
    <rect x="45" y="17" width="8" height="6" rx="1"/>
    <rect x="36" y="25" width="7" height="6" rx="1"/>
    <rect x="45" y="25" width="8" height="6" rx="1"/>
    <rect x="36" y="33" width="7" height="6" rx="1"/>
    <rect x="45" y="33" width="8" height="6" rx="1"/>
    <rect x="36" y="41" width="7" height="6" rx="1"/>
    <rect x="45" y="41" width="8" height="6" rx="1"/>
  </g>

  <!-- the card, tilted forward -->
  <path d="M10 8.6 36 4.4a2.6 2.6 0 0 1 3 2.6v50a2.6 2.6 0 0 1-3 2.6L10 55.4A2.6 2.6 0 0 1 8 52.8V11.2a2.6 2.6 0 0 1 2-2.6Z" fill="url(#sa-card)"/>

  <!-- X -->
  <path d="m13.6 21.5 6 0 3.9 6.9 3.9-6.9 6 0-6.9 10.5 6.9 10.5-6 0-3.9-6.9-3.9 6.9-6 0 6.9-10.5z" fill="url(#sa-x)"/>

  <!-- sparkles -->
  <path d="M47 35.5c1.1 5.4 2.6 6.9 8 8-5.4 1.1-6.9 2.6-8 8-1.1-5.4-2.6-6.9-8-8 5.4-1.1 6.9-2.6 8-8Z" fill="url(#sa-spark)"/>
  <path d="M58 22c.55 2.7 1.3 3.45 4 4-2.7.55-3.45 1.3-4 4-.55-2.7-1.3-3.45-4-4 2.7-.55 3.45-1.3 4-4Z" fill="#9ef0c2"/>
</svg>
