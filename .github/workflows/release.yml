name: Signed Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor.patch); manual runs build artifacts but do not publish a Release
        required: true
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies and Inno Setup
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          choco install innosetup --no-progress -y
      - name: Static checks and tests
        shell: pwsh
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:performance
          dotnet test apps/windows-companion/tests/SheetAgent.Companion.Tests.csproj -c Release
          pnpm validate:manifest
      - name: Materialize signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { throw 'WINDOWS_SIGNING_PFX_BASE64 is required.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sheet-agent-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "SHEET_AGENT_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, sign, verify, and checksum
        shell: pwsh
        env:
          SHEET_AGENT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          .\installer\build-installer.ps1 -Version $version -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -RequireSigning
          .\tests\excel-e2e\validate-windows-release.ps1 -RequireSigned
          .\installer\scan-defender.ps1 -Path .\artifacts\installer\SheetAgentSetup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SheetAgent-Windows-x64
          if-no-files-found: error
          path: |
            artifacts/installer/SheetAgentSetup-x64.exe
            artifacts/installer/SheetAgentSetup-x64.exe.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/installer/SheetAgentSetup-x64.exe artifacts/installer/SheetAgentSetup-x64.exe.sha256 --verify-tag --title 'Sheet Agent ${{ github.ref_name }}' --notes-file RELEASE_NOTES.md
